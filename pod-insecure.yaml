apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
spec:
  securityContext:
    runAsNonRoot: true
    fsGroup: 2000
  containers:
    - name: busybox
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: false
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /data
          name: app-volume
  volumes:
    - name: app-volume
      emptyDir: {}
