apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
spec:
  hostPID: true              # ❌ Access to host processes
  hostIPC: true              # ❌ Inter-process communication exposure
  containers:
    - name: busybox
      image: busybox:latest  # ❌ Latest tag (not pinned)
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true     # ❌ Full root access
        runAsUser: 0         # ❌ Running as root
      volumeMounts:
        - mountPath: /host
          name: host-volume
  volumes:
    - name: host-volume
      hostPath:
        path: /              # ❌ Full host filesystem access
